server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # === 探测资源放行 ===
    location = /logo.png { expires 30d; access_log off; }
    location /favicon.ico { access_log off; }
    location /robots.txt  { access_log off; }

    # === Gate cookie ===
    location = /_internal_gate {
        internal;
        add_header Set-Cookie "_gate_pass=1; Path=/; Max-Age=86400; HttpOnly" always;
        return 302 /;
    }

    # 兼容历史短链下载地址
    location = /rLFh {
        return 302 /TingWu.apk;
    }

    # APK / EXE / DEB 下载：正确 MIME + 强制下载头
    location ~* \.(apk|exe|deb)$ {
        set $gate "deny";
        if ($cookie__gate_pass = "1") { set $gate "allow"; }
        if ($arg__gate)               { set $gate "new";   }
        if ($gate = "new")  { rewrite ^ /_internal_gate last; }
        if ($gate = "deny") { return 505; }

        types { }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options 'nosniff';
    }

    location / {
        set $gate "deny";
        if ($cookie__gate_pass = "1") { set $gate "allow"; }
        if ($arg__gate)               { set $gate "new";   }
        if ($gate = "new")  { rewrite ^ /_internal_gate last; }
        if ($gate = "deny") { return 505; }

        try_files $uri $uri/ =404;
    }
}
